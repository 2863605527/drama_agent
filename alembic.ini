# Alembic config. DB URL comes from core.config via migrations/env.py (see env vars).
# NOTE: keep this file ASCII-only so it parses under both GBK (Windows) and UTF-8 (container) locales.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# alembic version table name
version_table = alembic_version

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
