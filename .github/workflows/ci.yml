name: CI/CD

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

# 同一分支新推送时取消旧的运行，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. 语法检查 + 后端测试（SQLite 内存库，不依赖外部服务）----------
  test:
    name: Lint & Unit/E2E Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install aiosqlite

      - name: Syntax compile check
        run: |
          python -m compileall -q agent auth core db mcp_client mcp_server schema skill tools main.py

      - name: Run tests
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-bytes
          LLM_API_KEY: ci-fake-key
          VOLC_ACCESS_KEY: ci-fake-ak
          VOLC_SECRET_KEY: ci-fake-sk
        run: |
          pytest -q -m "not mysql"

  # ---------- 1.5 后端测试 × MySQL 8 矩阵（P1-6：真实验证建表/补列/CRUD 兼容性）----------
  test-mysql:
    name: Backend Tests × MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_pw
          MYSQL_DATABASE: drama_test
          MYSQL_USER: drama
          MYSQL_PASSWORD: drama_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run MySQL compat tests
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-bytes
          LLM_API_KEY: ci-fake-key
          VOLC_ACCESS_KEY: ci-fake-ak
          VOLC_SECRET_KEY: ci-fake-sk
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: drama_test
          MYSQL_USER: drama
          MYSQL_PASSWORD: drama_test
        run: |
          pytest -q -m mysql

  # ---------- 1.6 前端单测 + 构建（P1-5：Vitest）----------
  frontend:
    name: Frontend Unit & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  # ---------- 1.7 E2E 冒烟（P1-7：Playwright）----------
  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install aiosqlite uvicorn

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: ${{ github.workspace }}
        run: |
          ENVIRONMENT=development \
          JWT_SECRET_KEY=ci-e2e-secret-key-at-least-32-bytes \
          LLM_API_KEY=ci-fake \
          VOLC_ACCESS_KEY=ci-fake \
          VOLC_SECRET_KEY=ci-fake \
          DRAMA_DB=sqlite \
          nohup python -m uvicorn main:app --port 8010 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8010/health && break || sleep 1
          done

      - name: Run E2E smoke
        working-directory: ${{ github.workspace }}/e2e
        run: npx playwright test

  # ---------- 2. 构建镜像并推送到 GHCR（PR 只构建不推；main/tag 推送）----------
  docker:
    name: Build & Push Image (GHCR)
    runs-on: ubuntu-latest
    needs: [test, test-mysql, frontend, e2e]
    permissions:
      contents: read
      packages: write          # 推送 GHCR 所需
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and (conditionally) push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
