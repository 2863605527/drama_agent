name: CI/CD

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

# 同一分支新推送时取消旧的运行，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. 语法检查 + 后端测试（SQLite 内存库，不依赖外部服务）----------
  test:
    name: Lint & Unit/E2E Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install aiosqlite

      - name: Syntax compile check
        run: |
          python -m compileall -q agent auth core db mcp_client mcp_server schema skill tools main.py

      - name: Run tests
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-bytes
          LLM_API_KEY: ci-fake-key
          VOLC_ACCESS_KEY: ci-fake-ak
          VOLC_SECRET_KEY: ci-fake-sk
        run: |
          pytest -q

  # ---------- 2. 构建镜像并推送到 GHCR（PR 只构建不推；main/tag 推送）----------
  docker:
    name: Build & Push Image (GHCR)
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write          # 推送 GHCR 所需
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and (conditionally) push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
