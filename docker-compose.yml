services:
  mysql:
    image: mysql:8.0
    container_name: drama-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-drama_root_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-drama_agent}
      MYSQL_USER: ${MYSQL_USER:-drama}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-drama_2024}
    ports:
      - "${MYSQL_PORT_HOST:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-drama_root_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ====== Redis：异步队列 broker + SSE 跨实例桥接（仅 celery/full profile 启用）======
  redis:
    image: redis:7-alpine
    container_name: drama-redis
    restart: unless-stopped
    profiles: ["celery", "full"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  drama-agent:
    build: .
    container_name: drama-agent
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8010}:8010"
    env_file:
      - .env
    environment:
      # 容器内固定连 mysql 服务，覆盖 .env 里的本地地址
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-drama_agent}
      MYSQL_USER: ${MYSQL_USER:-drama}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-drama_2024}
      # 本地默认单 worker（SSE/后台任务友好）；生产可设 2~4
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # P0 硬化：生产必须替换为随机串（openssl rand -hex 32）；本地未设置时用内置随机默认（可启动，但不建议生产沿用）
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-4f8a2b9c1e7d3f6a8b0c2d4e6f8a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7}
      # 异步队列：启用 celery profile 时自动指向 compose 内的 redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      USE_CELERY: ${USE_CELERY:-false}
    volumes:
      - ./assets:/app/assets
      - ./storage:/app/storage
      - ./logs:/app/logs

  # ====== Celery worker：视频/合成等长任务独立进程消费（仅 celery/full profile 启用）======
  celery-worker:
    build: .
    container_name: drama-celery-worker
    restart: unless-stopped
    profiles: ["celery", "full"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-drama_agent}
      MYSQL_USER: ${MYSQL_USER:-drama}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-drama_2024}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # P0 硬化：worker 与 Web 必须使用同一 JWT_SECRET_KEY（改密/吊销一致性）
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-4f8a2b9c1e7d3f6a8b0c2d4e6f8a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      USE_CELERY: "true"
      LOG_FORMAT: ${LOG_FORMAT:-json}
    # 与 Web 共享 assets/storage/logs，保证 worker 生成的片段/成片 Web 能直接访问
    volumes:
      - ./assets:/app/assets
      - ./storage:/app/storage
      - ./logs:/app/logs
    command: >
      celery -A tasks.celery_app.celery_app worker
      --loglevel=INFO
      --concurrency=${CELERY_CONCURRENCY:-2}
      -Q drama
      -n drama-worker@%h

  # ====== 数据库可视化（Adminer，浏览器访问 http://127.0.0.1:8080）======
  # 【安全】默认不启动：仅在显式需要时用 `docker compose --profile adminer up -d` 临时启用，
  # 用完 `docker compose --profile adminer down` 关闭。生产环境禁止对外开放该端口。
  adminer:
    image: adminer:4.8.1
    container_name: drama-adminer
    profiles: ["adminer"]
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  mysql_data:
  redis_data:
